<!doctype html><html><head><meta charset="utf-8"><style>{{themeCss}} body{margin:0} .demo-card{padding:14px;box-sizing:border-box} h2{margin:8px 0} p{margin:8px 0} input{box-sizing:border-box;width:100%;padding:7px} .actions{display:flex;justify-content:flex-end;margin-top:10px;gap:8px}</style></head><body><article class="demo-card" style="{{frameCss}}"><small>{{source}} · {{time}}</small><h2>{{title}}</h2><p>{{data.report}}</p><p>{{message}}</p><input id="note" placeholder="Review note"><div class="actions"><button onclick="parent.postMessage({action:'{{dismissAction}}'},'*')">{{dismissLabel}}</button><button class="primary" onclick="parent.postMessage({action:'submit',reply:document.getElementById('note').value},'*')">Submit</button></div></article></body></html>
