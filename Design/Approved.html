<script>

const themes={base:{name:'Temel',parent:null,patch:{appearance:{accent:{light:'#315d9c',dark:'#60a5fa'},background:{light:'#ffffff',dark:'#18181b'},titleSize:20,bodySize:16,radius:0},sound:sounds.soft,delivery:{lifetime:{mode:'expire',seconds:8},priority:'Normal'}}},daily:{name:'Günlük',parent:'base',patch:{}},success:{name:'Başarılı',parent:'daily',patch:{appearance:{accent:{light:'#24734f',dark:'#8ed6ac'},background:{light:'#e9f5ed',dark:'#193426'}},sound:sounds.done,delivery:{lifetime:{mode:'expire',seconds:6}}}},attention:{name:'Dikkat',parent:'daily',patch:{appearance:{accent:{light:'#8a580c',dark:'#f1c46f'},background:{light:'#fff1d5',dark:'#3b2c13'}},sound:sounds.double,delivery:{lifetime:{mode:'expire',seconds:12}}}},urgent:{name:'Acil',parent:'attention',patch:{appearance:{accent:{light:'#b32d40',dark:'#ffb6bf'},background:{light:'#fde5e9',dark:'#511d28'}},sound:sounds.alert,delivery:{lifetime:{mode:'ack'},priority:'High'}}},reminder:{name:'Hatırlatma',parent:'daily',patch:{appearance:{accent:{light:'#75549d',dark:'#c8b4ea'},background:{light:'#f0ebf8',dark:'#2b2339'}},sound:sounds.reminder,delivery:{lifetime:{mode:'ack'}}}}};

function notice(text){state.notice=text;root.querySelector('#un-message').innerHTML=text?`<div class="notice">${esc(text)}</div>`:'';}
function overrides(){const patch={};if(state.sound!=='inherit')patch.sound=state.sound==='off'?null:sounds[state.sound];if(state.lifetime!=='inherit')put(patch,'delivery.lifetime',state.lifetime==='ack'?{mode:'ack'}:{mode:'expire',seconds:Number(state.lifetime)});if(state.customColor)put(patch,'appearance.accent',{light:state.color,dark:state.color});if(state.customTitle)put(patch,'appearance.titleSize',state.titleSize);return patch;}
function readable(pair){function foreground(hex){const channels=hex.replace('#','').match(/../g).map(value=>parseInt(value,16)/255).map(value=>value<=.04045?value/12.92:Math.pow((value+.055)/1.055,2.4));return channels[0]*.2126+channels[1]*.7152+channels[2]*.0722>.38?'#202024':'#f4f4f5';}return{light:foreground(pair.light),dark:foreground(pair.dark)};}
function toast(result,title=state.title,body=state.body,action='Yeniden dene',sender=state.sender){

 const snooze=`<span class="snooze-split"><button type="button" class="snooze-main cursor-interaction" data-action="snooze">Snooze</button><button type="button" class="snooze-arrow cursor-interaction" data-action="snooze-options" aria-label="Erteleme süresini seç" aria-expanded="${state.snoozeOpen}">▾</button></span>`;
 const controls=`<span class="notification-footer">${snooze}${clickable?'':`<button type="button" class="primary-action cursor-interaction" style="background:${accent};color:${buttonText}" data-action="retry">${esc(action)}</button>`}</span>${state.snoozeOpen?`<div class="notification-menu" aria-label="Erteleme süresi">${[5,15,30].map(minutes=>`<button type="button" class="cursor-interaction" data-snooze-minutes="${minutes}">${minutes} dakika</button>`).join('')}</div>`:''}`;

function stage(result,title,body,action){

 let sender=state.sender;
 if(state.page==='themes'&&title===undefined){const key=[...result.chain].reverse().find(node=>samples[node.id])?.id||'daily';const sample=samples[key];title=sample.title;body=sample.body;action=sample.action;sender=sample.source;}
 if(state.page==='detail')sender=records[state.detailIndex].source;

 const complete=`<div class="preview-completed" role="status"><strong>✓ ${esc(state.completion||'Bildirim kapatıldı')}</strong><p>Bu önizlemenin etkileşimi tamamlandı.</p><button type="button" class="cursor-interaction" data-action="reopen">Yeniden göster</button></div>`;
 return `<div class="stage"><div class="preview-mode"><span class="caption">Bildirim önizlemesi</span>${modes}</div>${state.previewClosed?complete:toast(result,title,body,action,sender)}</div>`;

function field(label,path,control,result){const own=read(state.draft.patch,path)!==undefined;return `<div class="field"><div>${label}<span class="origin">${own?'Bu temada':esc(result.owners[path])+' temasından'}</span></div><div class="control">${control}${own&&state.theme!=='base'?`<button class="quiet inherit cursor-interaction" data-inherit="${path}">Devral</button>`:''}</div></div>`;}
function editor(){state.draft??=structuredClone(themes[state.theme]);const result=resolve(state.theme,{},state.draft),value=result.value;const parents=Object.keys(themes).filter(id=>id!==state.theme&&!resolve(id).chain.some(node=>node.id===state.theme));const selectedSound=value.sound===null?'off':Object.entries(sounds).find(([id,sound])=>sound.name===value.sound.name)[0];const nodes=[];function visit(parent,depth){for(const id of Object.keys(themes)){const node=id===state.theme?state.draft:themes[id];if(node.parent===parent){nodes.push({id,depth});visit(id,depth+1);}}}visit(null,0);const creation=state.creating?`<div class="new-theme"><h3>Alt tema oluştur</h3><p class="small">${esc(themes[state.theme].name)} temasının bütün ayarlarını devralacak.</p><label>Tema adı<input id="un-new-theme-name" maxlength="64" value="${esc(state.newThemeName)}" placeholder="Örneğin: Gece yedeklemesi"></label><div class="row"><button class="quiet cursor-interaction" data-action="cancel-new-theme">Vazgeç</button><button class="main cursor-interaction" data-action="confirm-new-theme">Alt temayı oluştur</button></div></div>`:'';const tree=nodes.map(({id,depth})=>`<button class="cursor-interaction" data-theme="${id}" aria-pressed="${id===state.theme}" style="padding-left:${8+depth*14}px">${id==='base'?'':'↳ '}${esc(themes[id].name)}</button>`).join('');return `<div class="head"><div><h1>Temalar</h1><p class="small">Görünüm, ses ve gösterim aynı temada.</p></div><button class="main cursor-interaction" data-action="new-theme">+ Alt tema oluştur</button></div><div class="tree-editor">${creation}<aside class="tree" aria-label="Tema kalıtım ağacı">${tree}</aside><div><p class="small" style="margin-bottom:14px">${result.chain.map(node=>esc(node.name)).join(' → ')}</p><div class="row" style="justify-content:space-between"><h2>${esc(themes[state.theme].name)}${state.dirty?' · değiştirildi':''}</h2><button class="cursor-interaction" data-action="play-theme">Sesi dinle</button></div><div class="summary">${summary(value)}</div>${stage(result)}${state.theme==='base'?'':`<label style="margin-bottom:18px">Üst tema<select id="un-parent">${options(parents.map(id=>[id,themes[id].name]),state.draft.parent)}</select></label>`}<section class="section"><h3>Görünüm</h3>${field('Zemin rengi','appearance.background',`<label class="small">Açık<input id="un-background" type="color" value="${value.appearance.background.light}" aria-label="Açık görünüm zemin rengi"></label><label class="small">Koyu<input id="un-background-dark" type="color" value="${value.appearance.background.dark}" aria-label="Koyu görünüm zemin rengi"></label>`,result)}${field('Vurgu rengi','appearance.accent',`<label class="small">Açık<input id="un-color" type="color" value="${value.appearance.accent.light}" aria-label="Açık görünüm vurgu rengi"></label><label class="small">Koyu<input id="un-color-dark" type="color" value="${value.appearance.accent.dark}" aria-label="Koyu görünüm vurgu rengi"></label>`,result)}${field('Başlık yazısı','appearance.titleSize',`<select id="un-size">${options([17,19,20,21,23].map(size=>[size,size+' px']),value.appearance.titleSize)}</select>`,result)}${field('Gövde yazısı','appearance.bodySize',`<select id="un-body-size">${options([15,16,17].map(size=>[size,size+' px']),value.appearance.bodySize)}</select>`,result)}</section><section class="section"><h3>Ses</h3>${field('Bildirim sesi','sound',`<select id="un-sound">${options([['off','Sessiz'],...Object.entries(sounds).map(([id,sound])=>[id,sound.name])],selectedSound)}</select>`,result)}</section><section class="section"><h3>Gösterim</h3>${field('Kapanma','delivery.lifetime',`<select id="un-life">${options([['6','6 saniye'],['8','8 saniye'],['12','12 saniye'],['ack','Kapatılana kadar']],value.delivery.lifetime.mode==='ack'?'ack':value.delivery.lifetime.seconds)}</select>`,result)}${field('Kuyruk sırası','delivery.priority',`<select id="un-priority">${options([['Normal','Normal'],['High','Öncelikli']],value.delivery.priority)}</select>`,result)}</section><div class="foot"><button class="main cursor-interaction" data-action="save" ${state.dirty?'':'disabled'}>Temayı kaydet</button><button class="cursor-interaction" data-action="discard" ${state.dirty?'':'disabled'}>Değişiklikleri geri al</button></div></div></div>`;}
function inbox(){const pending=records.filter(item=>!item.closed&&!(item.snoozedUntil>Date.now()));return `<div class="head"><div><h1>Bildirimler</h1><p class="small">${pending.length} bildirim işlem bekliyor</p></div><button class="main cursor-interaction" data-nav="compose">Bildirim oluştur</button></div>${pending.map(item=>{const index=records.indexOf(item),value=item.resolution.value;return `<article class="record"><span class="symbol" style="${tone(value.appearance.accent)}" aria-hidden="true">${item.theme==='success'?'✓':'!'}</span><div><div class="row"><span class="badge" style="${tone(value.appearance.accent)}">${themes[item.theme].name}</span><span class="small">${item.source} · ${item.time}</span></div><h2>${item.title}</h2><p class="body">${item.body}</p><div class="row"><button class="quiet cursor-interaction" data-detail="${index}">Ayrıntı</button><button class="quiet cursor-interaction" data-close="${index}">Kapat</button></div></div><button class="go cursor-interaction" data-run="${index}" style="${tone(value.appearance.accent)}">${item.action}</button></article>`}).join('')||'<p>Bekleyen bildirim yok.</p>'}`;}

function customThemeCode(id){
 const definitions=[],variables={base:'NotificationThemes.Base',daily:'NotificationThemes.Daily',success:'NotificationThemes.Success',attention:'NotificationThemes.Attention',urgent:'NotificationThemes.Urgent',reminder:'NotificationThemes.Reminder'};
 const soundNames={soft:'Subtle',done:'Completed',double:'DoubleAlert',reminder:'Reminder',alert:'Attention'};
 function patchCode(patch){const fields=[];
  if(Object.hasOwn(patch,'sound')){const key=Object.keys(sounds).find(key=>sounds[key].name===patch.sound?.name);fields.push('Sound = new('+(patch.sound===null?'null':'NotificationSounds.'+soundNames[key])+')');}
  if(patch.appearance){const appearance=[];for(const[key,value]of Object.entries(patch.appearance)){const property=key[0].toUpperCase()+key.slice(1);appearance.push(property+' = new('+(typeof value==='object'?'new ThemeColor { Light = ColorTranslator.FromHtml('+JSON.stringify(value.light)+'), Dark = ColorTranslator.FromHtml('+JSON.stringify(value.dark)+') }':value)+')');}fields.push('Appearance = new() { '+appearance.join(', ')+' }');}
  if(patch.delivery){const delivery=[];if(patch.delivery.priority)delivery.push('Priority = new(NotificationPriority.'+patch.delivery.priority+')');if(patch.delivery.lifetime)delivery.push('Lifetime = new('+(patch.delivery.lifetime.mode==='ack'?'NotificationLifetimes.UntilAcknowledged':'new ExpiringLifetime(TimeSpan.FromSeconds('+patch.delivery.lifetime.seconds+'))')+')');fields.push('Delivery = new() { '+delivery.join(', ')+' }');}
  return fields.length?'new() { '+fields.join(', ')+' }':'new()';
 }
 function define(key){if(variables[key])return variables[key];const node=themes[key],parent=define(node.parent),variable='customTheme'+definitions.length;definitions.push('var '+variable+' = new NotificationTheme\n{\n    Name = '+JSON.stringify(node.name)+',\n    Parent = '+parent+',\n    Overrides = '+patchCode(node.patch)+'\n};');variables[key]=variable;return variable;}
 const variable=define(id);return definitions.join('\n\n')+'\n\n'+code(true).replace('Theme = NotificationThemes.undefined','Theme = '+variable);
}
function code(nested=false){if(!nested&&!['base','daily','success','attention','urgent','reminder'].includes(state.compose))return customThemeCode(state.compose);const names={base:'Base',daily:'Daily',success:'Success',attention:'Attention',urgent:'Urgent',reminder:'Reminder'};let text='await NotificationClient.SendAsync(new()\n{\n    Title = '+JSON.stringify(state.title)+',\n    Message = '+JSON.stringify(state.body)+',\n    Source = '+JSON.stringify(state.sender)+',\n    Theme = NotificationThemes.'+names[state.compose];if(state.interaction==='acknowledge')text+=',\n    Interaction = NotificationInteractions.ClickToAcknowledge';const fields=[];if(state.sound!=='inherit')fields.push('        Sound = new('+(state.sound==='off'?'null':'NotificationSounds.'+({soft:'Subtle',done:'Completed',double:'DoubleAlert',reminder:'Reminder',alert:'Attention'}[state.sound]))+')');if(state.customTitle||state.customColor){const parts=[];if(state.customTitle)parts.push('            TitleSize = new('+state.titleSize+')');if(state.customColor)parts.push('            Accent = new(ColorTranslator.FromHtml("'+state.color+'"))');fields.push('        Appearance = new()\n        {\n'+parts.join(',\n')+'\n        }');}if(state.lifetime!=='inherit')fields.push('        Delivery = new()\n        {\n            Lifetime = new('+(state.lifetime==='ack'?'NotificationLifetimes.UntilAcknowledged':'new ExpiringLifetime(TimeSpan.FromSeconds('+state.lifetime+'))')+')\n        }');if(fields.length)text+=',\n    Overrides = new()\n    {\n'+fields.join(',\n')+'\n    }';return text+'\n});';}
function compose(){const result=resolve(state.compose,overrides());return `<div class="head"><div><h1>Bildirim oluştur</h1><p class="small">Bir tema seç; ses ve gösterim davranışı birlikte gelsin.</p></div></div><div class="form"><label>Gönderen program<input id="un-sender" value="${esc(state.sender)}"></label><label>Başlık<input id="un-title" value="${esc(state.title)}"></label><label>Mesaj<textarea id="un-body" rows="2">${esc(state.body)}</textarea></label><label>Tema<select id="un-composer">${options(Object.keys(themes).filter(id=>id!=='base').map(id=>[id,themes[id].name]),state.compose)}</select></label><p class="hint">${summary(result.value)}</p><details id="un-overrides"><summary>Yalnız bu bildirimde değiştir</summary><div class="two"><label>Ses<select id="un-override-sound">${options([['inherit','Temadan devral'],['off','Sessiz'],...Object.entries(sounds).map(([id,sound])=>[id,sound.name])],state.sound)}</select></label><label>Kapanma<select id="un-override-life">${options([['inherit','Temadan devral'],['6','6 saniye'],['12','12 saniye'],['ack','Kapatılana kadar']],state.lifetime)}</select></label><div><label class="check"><input id="un-custom-color" type="checkbox" ${state.customColor?'checked':''}>Vurgu rengini değiştir</label>${state.customColor?`<input id="un-override-color" type="color" value="${state.color}" aria-label="Bu bildirimin rengi">`:''}</div><div><label class="check"><input id="un-custom-title" type="checkbox" ${state.customTitle?'checked':''}>Başlık boyutunu değiştir</label>${state.customTitle?`<select id="un-override-size" aria-label="Bu bildirimin başlık boyutu">${options([19,22,25].map(size=>[size,size+' px']),state.titleSize)}</select>`:''}</div></div><p class="hint">Kayıtlı tema korunur. Yalnız bu gönderimin seçili alanları değişir.</p></details><div class="row"><button class="main cursor-interaction" data-action="preview">Önizlemeyi aç</button><button class="cursor-interaction" data-action="play-compose">Sesi dinle</button><button class="quiet cursor-interaction" data-action="reset">Temadan devral</button></div>${stage(result)}<details><summary>Önerilen geliştirici kullanımı</summary><pre>${esc(code())}</pre></details></div>`;}
function settings(){return `<div class="head"><div><h1>Tercihler</h1><p class="small">Bütün bildirimler için kişisel tercihler.</p></div></div><div class="form"><section class="section"><h3>Okunabilirlik</h3><label>Metin ölçeği<select id="un-scale">${options([['1','%100'],['1.15','%115'],['1.3','%130']],state.scale)}</select></label><p class="hint">Başlıklar, mesajlar ve kontroller birlikte büyür.</p></section><section class="section"><h3>Ses</h3><label class="check"><input id="un-quiet" type="checkbox" ${state.quiet?'checked':''}>Bütün bildirimleri sessize al</label><p class="hint">Temanın sesi saklanır. Sessizlik açıkken çalınmaz.</p></section><section class="section"><h3>Görünüm</h3><p>Panel açık veya koyu sistem görünümünü izler. Bildirimin temasını değiştirmek uygulama kabuğunu boyamaz.</p></section></div>`;}

async function play(sound){
 if(state.quiet){notice('Genel sessizlik açık. Ses çalınmadı.');return;}if(!sound){notice('Bu seçim sessiz.');return;}
 try{
  const Context=window.AudioContext||window.webkitAudioContext;if(!Context){notice('Tarayıcı ses önizlemesini desteklemiyor.');return;}
  if(play.active){const previous=play.active;play.active=null;await previous.close();}
  const context=new Context();play.active=context;await context.resume();
  const master=context.createGain(),limiter=context.createDynamicsCompressor();master.gain.value=sound.volume;limiter.threshold.value=-14;limiter.knee.value=12;limiter.ratio.value=6;master.connect(limiter);limiter.connect(context.destination);
  const origin=context.currentTime+.025;let ending=origin;
  for(const[frequency,delay,length]of sound.notes){const start=origin+delay;ending=Math.max(ending,start+length);
   const partials=sound.instrument==='bell'?[[1,1,1],[2.01,.22,.55],[2.76,.08,.28]]:sound.instrument==='pluck'?[[1,1,1],[2,.18,.5],[3,.06,.3]]:[[1,1,1]];
   for(const[multiple,amplitude,decay]of partials){const oscillator=context.createOscillator(),envelope=context.createGain();oscillator.type=sound.instrument==='alarm'?'square':sound.instrument==='mallet'?'triangle':'sine';oscillator.frequency.setValueAtTime(frequency*multiple,start);const attack=sound.instrument==='alarm'?.009:.014;envelope.gain.setValueAtTime(.0001,start);envelope.gain.linearRampToValueAtTime(amplitude,start+attack);
    if(sound.instrument==='alarm'){envelope.gain.setValueAtTime(amplitude,start+length-.025);envelope.gain.exponentialRampToValueAtTime(.0001,start+length);}else envelope.gain.exponentialRampToValueAtTime(.0001,start+Math.max(.04,length*decay));
    oscillator.connect(envelope);envelope.connect(master);oscillator.start(start);oscillator.stop(start+length);
   }
  }
  setTimeout(()=>{if(play.active===context)play.active=null;if(context.state!=='closed')context.close();},Math.ceil((ending-context.currentTime+.15)*1000));notice(sound.name+' çalınıyor.');
 }catch{notice('Ses önizlemesi açılamadı.');}
}
function finishPreview(message,snoozeMinutes=null){if(state.page==='detail'){const item=records[state.detailIndex];if(snoozeMinutes)item.snoozedUntil=Date.now()+snoozeMinutes*60000;else item.closed=true;state.page='inbox';}state.previewClosed=true;state.snoozeOpen=false;state.completion=message;state.notice='';if(play.active){const context=play.active;play.active=null;context.close();}render();persist();queueMicrotask(()=>root.querySelector('[data-action="reopen"]')?.focus());}
root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.interaction){state.interaction=button.dataset.interaction;state.previewClosed=false;state.completion='';state.snoozeOpen=false;render();persist();return;}if(button.dataset.snoozeMinutes){finishPreview(button.dataset.snoozeMinutes+' dakika ertelendi',Number(button.dataset.snoozeMinutes));return;}if(button.dataset.nav){navigate(button.dataset.nav);return;}if(button.dataset.theme){if(state.dirty){notice('Önce taslağı kaydet veya geri al.');return;}state.theme=button.dataset.theme;state.draft=null;state.previewClosed=false;render();persist();return;}if(button.dataset.inherit){put(state.draft.patch,button.dataset.inherit,null,true);state.dirty=true;render();return;}if(button.dataset.detail!==undefined){const item=records[Number(button.dataset.detail)];state.detailIndex=Number(button.dataset.detail);navigate('detail');return;}if(button.dataset.run!==undefined||button.dataset.close!==undefined){const item=records[Number(button.dataset.run??button.dataset.close)];item.closed=true;if(state.page==='detail')state.page='inbox';state.notice=button.dataset.run!==undefined?item.action+' seçildi.':'Bildirim kapatıldı.';render();return;}switch(button.dataset.action){case'new-theme':if(state.dirty){notice('Önce mevcut tema taslağını kaydet veya geri al.');break;}state.creating=true;state.newThemeName='';render();break;
case'cancel-new-theme':state.creating=false;state.newThemeName='';render();break;
case'confirm-new-theme':{if(state.dirty){notice('Önce üst temadaki değişiklikleri kaydet veya geri al.');break;}const name=state.newThemeName.trim();if(!name){notice('Alt tema için bir ad yaz.');break;}if(Object.values(themes).some(theme=>theme.name.toLocaleLowerCase('tr-TR')===name.toLocaleLowerCase('tr-TR'))){notice('Bu adla bir tema var. Başka bir ad seç.');break;}const id='custom_'+crypto.randomUUID().replaceAll('-','');themes[id]={name,parent:state.theme,patch:{}};state.theme=id;state.compose=id;state.draft=null;state.dirty=false;state.creating=false;state.newThemeName='';state.previewClosed=false;state.notice='Alt tema oluşturuldu. Değiştirmediğin bütün ayarlar üst temadan geliyor.';render();persist();break;}case'save':themes[state.theme]=structuredClone(state.draft);state.dirty=false;state.notice='Tema kaydedildi. Yeni bildirimler bu ayarları kullanacak.';render();persist();break;case'discard':state.draft=null;state.dirty=false;state.notice='Taslak geri alındı.';render();break;case'play-theme':play(resolve(state.theme,{},state.draft).value.sound);break;case'play-compose':play(resolve(state.compose,overrides()).value.sound);break;case'preview':state.previewClosed=false;render();play(resolve(state.compose,overrides()).value.sound);break;case'close-preview':finishPreview('Bildirim kapatıldı');break;case'acknowledge':finishPreview('Okundu olarak tamamlandı');break;case'reopen':state.previewClosed=false;state.completion='';render();break;case'reset':state.sound='inherit';state.lifetime='inherit';state.customColor=false;state.customTitle=false;render();break;case'retry':finishPreview(button.textContent+' seçildi');break;case'snooze':finishPreview('5 dakika ertelendi',5);break;case'snooze-options':state.snoozeOpen=!state.snoozeOpen;render();break;}});
root.addEventListener('input',event=>{if(event.target.id==='un-new-theme-name')state.newThemeName=event.target.value;});
root.addEventListener('change',event=>{const input=event.target;if(input.id==='un-new-theme-name'){state.newThemeName=input.value;return;}if(input.id==='un-sender'){state.sender=input.value;const sender=root.querySelector('.sender-name');if(sender)sender.textContent=state.sender;const icon=root.querySelector('.sender-icon');if(icon)icon.textContent=Array.from(state.sender.trim()||'B')[0].toLocaleUpperCase('tr-TR');const example=root.querySelector('pre');if(example)example.textContent=code();return;}if(input.id==='un-title'||input.id==='un-body'){if(input.id==='un-title')state.title=input.value;else state.body=input.value;const title=root.querySelector('.notification-title'),body=root.querySelector('.notification-body');if(title)title.textContent=state.title;if(body)body.textContent=state.body;const example=root.querySelector('pre');if(example)example.textContent=code();return;}const fields={'un-background':['appearance.background',{...resolve(state.theme,{},state.draft).value.appearance.background,light:input.value}],'un-background-dark':['appearance.background',{...resolve(state.theme,{},state.draft).value.appearance.background,dark:input.value}],'un-color':['appearance.accent',{...resolve(state.theme,{},state.draft).value.appearance.accent,light:input.value}],'un-color-dark':['appearance.accent',{...resolve(state.theme,{},state.draft).value.appearance.accent,dark:input.value}],'un-size':['appearance.titleSize',Number(input.value)],'un-body-size':['appearance.bodySize',Number(input.value)],'un-sound':['sound',input.value==='off'?null:sounds[input.value]],'un-life':['delivery.lifetime',input.value==='ack'?{mode:'ack'}:{mode:'expire',seconds:Number(input.value)}],'un-priority':['delivery.priority',input.value]};if(fields[input.id]){put(state.draft.patch,...fields[input.id]);state.dirty=true;render();return;}switch(input.id){case'un-new-theme-name':state.newThemeName=input.value;break;case'un-parent':state.draft.parent=input.value;state.dirty=true;break;case'un-composer':state.compose=input.value;break;case'un-title':state.title=input.value;break;case'un-body':state.body=input.value;break;case'un-override-sound':state.sound=input.value;break;case'un-override-life':state.lifetime=input.value;break;case'un-custom-color':state.customColor=input.checked;break;case'un-override-color':state.color=input.value;break;case'un-custom-title':state.customTitle=input.checked;break;case'un-override-size':state.titleSize=Number(input.value);break;case'un-scale':state.scale=Number(input.value);break;case'un-quiet':state.quiet=input.checked;break;default:return;}render();persist();});
window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);if(!state.dirty){state.draft=null;render();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.app'),onChange:render});tweak.addSlider(state,'scale',{label:'Metin ölçeği',min:1,max:1.3,step:.05});}
})();
